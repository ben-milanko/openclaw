name: Ben Gateway package

on:
  push:
    branches: ["ci/ben-gateway-package-*"]
    paths: [.github/workflows/ben-gateway-package.yml]

permissions:
  contents: read

concurrency:
  group: ben-gateway-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'ben-milanko/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE: 2643eb8d4d442e9d155c3180a71eaa8ad21b8f50
      EXPECTED_TREE: 0c8c29f0deedb321cf4aa7df65cdae7205af4ed9
      UPSTREAM_SOURCE: e13cf15ece9bbd969b7362927c315362c90c97ff
      GOMEMLIMIT: 4GiB
      GOMAXPROCS: "2"
      GOGC: "100"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ben-milanko/openclaw
          ref: 2643eb8d4d442e9d155c3180a71eaa8ad21b8f50
          persist-credentials: false
          fetch-depth: 2

      - name: Verify frozen inputs and runner capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/ben-preparation"
          python3 - <<'PYTHON'
          import json, os, shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          available = int(memory['MemAvailable'].split()[0]) * 1024
          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          Path(os.environ['RUNNER_TEMP'], 'ben-preparation', 'runner.json').write_text(json.dumps({
              'availableMemoryBytes': available, 'freeDiskBytes': free, 'cpuCount': os.cpu_count(),
          }, indent=2) + '\n')
          assert available >= 12 * 1024**3
          assert free >= 20 * 1024**3
          PYTHON

      - name: Set up pinned isolated check toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
          semantic-checks: "true"

      - name: Set up checksum-pinned test runtime
        uses: ./.github/actions/setup-test-bun

      - name: Generate canonical metadata and snapshots; format changed source
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          pnpm config:channels:gen
          pnpm prompt:snapshots:gen
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['UPSTREAM_SOURCE']], text=True).splitlines()
          files = [name for name in changed if Path(name).is_file()]
          subprocess.run(['pnpm', 'format', *files], check=True)
          root = Path(os.environ['RUNNER_TEMP'], 'ben-preparation')
          (root / 'changed-files.json').write_text(json.dumps(files, indent=2) + '\n')
          patch = subprocess.check_output(['git', 'diff', '--binary', 'HEAD'])
          (root / 'generated-and-format.patch').write_bytes(patch)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PYTHON

      - name: Focused custom boundary and owning sibling tests
        id: tests
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'], 'ben-preparation')
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['UPSTREAM_SOURCE']], text=True).splitlines()
          selected = {name for name in changed if name.endswith('.test.ts') and Path(name).is_file()}
          selected.update(name for name in [
              'src/plugins/registry.factory-bindings.test.ts',
              'src/agents/tools/cron-tool.schema.test.ts',
              'src/agents/tools/cron-tool-creator-cap.test.ts',
              'src/agents/exec-tool-target-pinning.test.ts',
              'src/infra/update-database-engine-admission.test.ts',
              'src/cli/update-cli/update-command-package.test.ts',
              'src/auto-reply/reply/agent-runner-result-accounting.test.ts',
          ] if Path(name).is_file())
          selected.update(str(name) for name in Path('src/gateway').glob('server.chat-goal*.test.ts'))
          files = sorted(selected)
          (root / 'selected-tests.json').write_text(json.dumps(files, indent=2) + '\n')
          result = subprocess.run(['node', 'scripts/run-vitest.mjs', *files, '--maxWorkers=1'])
          (root / 'tests.exit').write_text(str(result.returncode) + '\n')
          raise SystemExit(result.returncode)
          PYTHON

      - name: Production type checks
        id: types
        if: always() && steps.generate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm tsgo:prod

      - name: Typed lint for exact changed source
        id: lint
        if: always() && steps.generate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['UPSTREAM_SOURCE']], text=True).splitlines()
          groups = [
              ('config/tsconfig/oxlint.core.json', ('src/', 'ui/', 'packages/')),
              ('extensions/tsconfig.json', ('extensions/',)),
          ]
          failures = []
          for config, prefixes in groups:
              paths = [name for name in changed if name.startswith(prefixes) and name.endswith(('.ts', '.mts', '.mjs', '.tsx')) and Path(name).is_file()]
              if paths:
                  result = subprocess.run(['node', 'scripts/run-oxlint.mjs', '--type-aware', '--tsconfig', config, *paths])
                  if result.returncode:
                      failures.append((config, result.returncode))
          raise SystemExit(1 if failures else 0)
          PYTHON

      - name: Verify canonical generator and formatter readback
        id: readback
        if: always() && steps.generate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm config:channels:check
          pnpm prompt:snapshots:check
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          files = json.loads(Path(os.environ['RUNNER_TEMP'], 'ben-preparation', 'changed-files.json').read_text())
          subprocess.run(['pnpm', 'format:check', *files], check=True)
          PYTHON

      - name: Retain exact preparation outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ben-gateway-115-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ben-preparation/
          if-no-files-found: error
          retention-days: 14

      - name: Require all preparation layers
        if: always()
        env:
          GENERATE: ${{ steps.generate.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          READBACK: ${{ steps.readback.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GENERATE" = success
          test "$TESTS" = success
          test "$TYPES" = success
          test "$LINT" = success
          test "$READBACK" = success
