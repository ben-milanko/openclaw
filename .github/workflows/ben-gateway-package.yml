name: Ben Gateway package

on:
  push:
    branches: ["ci/ben-gateway-package-*"]
    paths: [.github/workflows/ben-gateway-package.yml]

permissions:
  contents: read

concurrency:
  group: ben-gateway-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'ben-milanko/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE: 154d17d00c3e606487f1565d775e068d4a4b820d
      EXPECTED_TREE: 70f274271088c09c97c938b202440e4a61bb08c3
      GOMEMLIMIT: 4GiB
      GOMAXPROCS: "2"
      GOGC: "100"
      NODE_OPTIONS: --max-old-space-size=6144
      OPENCLAW_DOCKER_PACKAGE_BUILD_TIMEOUT_MS: "5400000"
    steps:
      # The PR changes this workflow; package bytes come only from the pinned stable backport.
      - name: Checkout pinned package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ben-milanko/openclaw
          ref: 154d17d00c3e606487f1565d775e068d4a4b820d
          persist-credentials: false
          fetch-depth: 2

      - name: Verify source and runner capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/ben-package"
          python3 - <<'PYTHON'
          import json, os, shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          available = int(memory['MemAvailable'].split()[0]) * 1024
          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          Path(os.environ['RUNNER_TEMP'], 'ben-package', 'runner.json').write_text(json.dumps({
              'availableMemoryBytes': available, 'freeDiskBytes': free, 'cpuCount': os.cpu_count(),
          }, indent=2) + '\n')
          assert available >= 12 * 1024**3, 'Runner needs at least 12 GiB available RAM'
          assert free >= 20 * 1024**3, 'Runner needs at least 20 GiB free disk'
          PYTHON

      - name: Set up pinned package toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"

      - name: Prove the quota regression and check package pinning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/openclaw-pin-tests"
          chmod 700 "$HOME/.cache/openclaw-pin-tests"
          export TMPDIR="$HOME/.cache/openclaw-pin-tests" SQLITE_TMPDIR="$HOME/.cache/openclaw-pin-tests"
          pin_source=src/cli/update-cli/update-command-package-target.ts
          trap 'git restore --source=HEAD -- "$pin_source"' EXIT
          git show "HEAD^:$pin_source" > "$pin_source"
          set +e
          FS_MODULE_CACHE_PATH="$RUNNER_TEMP/ben-package/regression-before-cache.json" \
            node scripts/run-vitest.mjs src/cli/update-cli/update-command-package-target.test.ts \
            --maxWorkers=1 --testNamePattern 'pins on the configured cache filesystem' \
            > "$RUNNER_TEMP/ben-package/regression-before.log" 2>&1
          baseline_exit=$?
          set -e
          git restore --source=HEAD -- "$pin_source"
          trap - EXIT
          test "$baseline_exit" -eq 1
          grep -F 'The fixed system temp filesystem is over quota' "$RUNNER_TEMP/ben-package/regression-before.log"
          FS_MODULE_CACHE_PATH="$RUNNER_TEMP/ben-package/regression-after-cache.json" \
            node scripts/run-vitest.mjs src/cli/update-cli/update-command-package-target.test.ts \
            src/cli/update-cli/update-command-package-target-staging.test.ts src/infra/tmp-openclaw-dir.test.ts \
            --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/ben-package/regression-after.log"
          test -z "$(git status --porcelain)"

      - name: Check production types
        shell: bash
        run: |
          set -euo pipefail
          pnpm tsgo:core
          pnpm tsgo:ui
          pnpm tsgo:extensions

      - name: Check integration typed lint
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/run-oxlint.mts --type-aware --tsconfig config/tsconfig/oxlint.core.json src/cli/update-cli/update-command-execution.ts src/infra/update-managed-service-handoff.ts src/infra/backup-sqlite-snapshot.ts src/infra/update-database-engine-admission.test.ts src/cli/update-cli/update-command-package-target.ts src/cli/update-cli/update-command-package-target.test.ts
          node --import ./scripts/tsx.mjs scripts/run-oxlint.mts --type-aware --tsconfig config/tsconfig/oxlint.scripts.json test/scripts/tsdown-declaration-resolution.test.ts

      - name: Build and check canonical package
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.12.1
          test "$(pnpm --version)" = 12.15.0
          node scripts/package-openclaw-for-docker.mjs \
            --output-dir "$RUNNER_TEMP/ben-package" \
            --output-name openclaw-2026.11.3-ben-154d17d0.tgz \
            2>&1 | tee "$RUNNER_TEMP/ben-package/build.log"
          test -z "$(git status --porcelain)"

      - name: Verify packaged identity and retain digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, os, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'], 'ben-package')
          archive = root / 'openclaw-2026.11.3-ben-154d17d0.tgz'
          with tarfile.open(archive) as package:
              manifest = json.load(package.extractfile('package/package.json'))
              build = json.load(package.extractfile('package/dist/build-info.json'))
          assert manifest['version'] == build['version'] == '2026.11.3'
          assert manifest['openclaw']['schemaVersions'] == {'state': 22, 'agent': 27}
          assert build['commit'] == os.environ['EXPECTED_SOURCE']
          assert isinstance(build.get('buildId'), str) and build['buildId']
          with archive.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          (root / 'package-receipt.json').write_text(json.dumps({
              'sourceCommit': os.environ['EXPECTED_SOURCE'], 'sourceTree': os.environ['EXPECTED_TREE'],
              'archive': archive.name, 'sha256': digest, 'build': build,
              'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'scope': 'Candidate only; no deployment, release publication or external plugin activation',
          }, indent=2) + '\n')
          PYTHON

      - name: Upload verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ben-gateway-2026.11.3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ben-package/openclaw-2026.11.3-ben-154d17d0.tgz
            ${{ runner.temp }}/ben-package/package-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ben-gateway-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ben-package/build.log
            ${{ runner.temp }}/ben-package/runner.json
            ${{ runner.temp }}/ben-package/regression-before.log
            ${{ runner.temp }}/ben-package/regression-after.log
          if-no-files-found: ignore
          retention-days: 14
